<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="Portfolio, rajamuhammadali.dev">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  .pop  { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
  .draw { animation: draw 1.1s ease-in-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }

  .blk { transform-box: fill-box; transform-origin: left; animation: grow 7s cubic-bezier(.2,.7,.2,1) infinite both; }
  @keyframes grow { 0% { transform: scaleX(0); opacity: 0; } 10%,90% { transform: scaleX(1); opacity: 1; } 100% { opacity: 0; } }
  .cur { animation: cur 7s ease-in-out infinite; }
  @keyframes cur { 0%,30% { transform: translate(0,0); } 55%,62% { transform: translate(-62px,58px); } 66% { transform: translate(-62px,58px) scale(.9); } 70%,100% { transform: translate(-62px,58px); } }
  .clk { animation: clk 7s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes clk { 0%,62% { opacity: 0; transform: scale(.2); } 66% { opacity: .8; } 76%,100% { opacity: 0; transform: scale(2); } }
</style>
