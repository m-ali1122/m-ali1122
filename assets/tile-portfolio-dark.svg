<text x="28" y="96" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#f4f4ec">Portfolio</text>
<text x="28" y="140" class="sans" font-size="15" fill="#9d9d92">rajamuhammadali.dev, the</text><text x="28" y="162" class="sans" font-size="15" fill="#9d9d92">longer version of this page.</text>
