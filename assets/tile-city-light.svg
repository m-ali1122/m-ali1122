<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="CityMind, an urban intelligence system">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  .pop  { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
  .draw { animation: draw 1.1s ease-in-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }

  .r1 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: r1 8s ease-in-out infinite; }
  .r2 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: r2 8s ease-in-out infinite; }
  @keyframes r1 { 0%,8% { stroke-dashoffset: 1; opacity: 1; } 30%,42% { stroke-dashoffset: 0; opacity: 1; } 50%,100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes r2 { 0%,48% { stroke-dashoffset: 1; } 72%,92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .blk { animation: blk 8s infinite; } @keyframes blk { 0%,40% { opacity: 0; } 44%,92% { opacity: 1; } 100% { opacity: 0; } }
  .amb { animation: amb 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes amb { 50% { transform: scale(1.25); } }
</style>
<defs><clipPath id="win"><rect x="330" y="26" width="244" height="228" rx="10"/></clipPath></defs>
<rect x="1" y="1" width="598" height="278" rx="14" fill="#f7f7f2" stroke="#dddcd2"/>
<text x="28" y="50" class="mono" font-size="11.5" letter-spacing="2" fill="#6b8f00">AI / SEARCH</text>
<text x="28" y="96" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#16160f">CityMind</text>
<text x="28" y="140" class="sans" font-size="15" fill="#66665a">Ambulances placed by a GA,</text><text x="28" y="162" class="sans" font-size="15" fill="#66665a">routes replanned by LPA*.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#aeae9e">view repo -&gt;</text>
<rect x="330" y="26" width="244" height="228" rx="10" fill="#ffffff" stroke="#dddcd2"/>
<g clip-path="url(#win)">
<line x1="348" y1="62" x2="348" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="374" y1="62" x2="374" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="400" y1="62" x2="400" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="426" y1="62" x2="426" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="452" y1="62" x2="452" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="478" y1="62" x2="478" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="504" y1="62" x2="504" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="530" y1="62" x2="530" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="556" y1="62" x2="556" y2="244" stroke="#aeae9e" stroke-opacity=".6"/><line x1="348" y1="62" x2="556" y2="62" stroke="#aeae9e" stroke-opacity=".6"/><line x1="348" y1="88" x2="556" y2="88" stroke="#aeae9e" stroke-opacity=".6"/><line x1="348" y1="114" x2="556" y2="114" stroke="#aeae9e" stroke-opacity=".6"/><line x1="348" y1="140" x2="556" y2="140" stroke="#aeae9e" stroke-opacity=".6"/><line x1="348" y1="166" x2="556" y2="166" stroke="#aeae9e" stroke-opacity=".6"/><line x1="348" y1="192" x2="556" y2="192" stroke="#aeae9e" stroke-opacity=".6"/><line x1="348" y1="218" x2="556" y2="218" stroke="#aeae9e" stroke-opacity=".6"/><line x1="348" y1="244" x2="556" y2="244" stroke="#aeae9e" stroke-opacity=".6"/>
<polyline points="374,218 374,140 452,140 452,88 530,88" fill="none" stroke="#6b8f00" stroke-width="3" stroke-linejoin="round" pathLength="1" class="r1"/>
<polyline points="374,218 374,140 426,140 426,62 530,62 530,88" fill="none" stroke="#db2777" stroke-width="3" stroke-linejoin="round" pathLength="1" class="r2"/>
<g class="blk"><rect x="446" y="108" width="12" height="12" fill="#dc2626"/><text x="462" y="118" class="mono" font-size="9" fill="#dc2626">road closed</text></g>
<rect x="367" y="211" width="14" height="14" rx="3" fill="#a16207" class="amb"/>
<rect x="471" y="185" width="14" height="14" rx="3" fill="#a16207" fill-opacity=".55"/>
<circle cx="530" cy="88" r="7" fill="none" stroke="#dc2626" stroke-width="2"><animate attributeName="r" values="5;11;5" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="344" y="48" class="mono" font-size="10.5" fill="#aeae9e">LPA* replans only what changed</text>
</g>
</svg>
