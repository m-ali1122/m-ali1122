<text x="28" y="172" class="sans" font-size="15" fill="#9d9d92">A newspaper set for one reader,</text><text x="28" y="194" class="sans" font-size="15" fill="#9d9d92">fresh every morning.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#58584f">view repo -&gt;</text>
