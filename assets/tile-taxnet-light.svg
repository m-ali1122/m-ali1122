<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="TaxNet, graph-based financial-crime intelligence">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  .pop  { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
  .draw { animation: draw 1.1s ease-in-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }

  .mv { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.6,0,.3,1); }
  .lbl { animation: lbl 8s infinite; } @keyframes lbl { 0%,30% { opacity: 1; } 38%,100% { opacity: 0; } }
  .one { animation: one 8s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes one { 0%,34% { opacity: 0; transform: scale(.4); } 40%,92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
  .ring { animation: ring 8s infinite; } @keyframes ring { 0%,50% { opacity: 0; } 56%,92% { opacity: 1; } 100% { opacity: 0; } }
@keyframes m0 { 0%,14% { transform: translate(0,0); opacity: 1; } 34% { transform: translate(70px,40px); opacity: 1; } 38%,94% { transform: translate(70px,40px); opacity: 0; } 100% { transform: translate(0,0); opacity: 0; } }
@keyframes m1 { 0%,14% { transform: translate(0,0); opacity: 1; } 34% { transform: translate(-62px,46px); opacity: 1; } 38%,94% { transform: translate(-62px,46px); opacity: 0; } 100% { transform: translate(0,0); opacity: 0; } }
@keyframes m2 { 0%,14% { transform: translate(0,0); opacity: 1; } 34% { transform: translate(50px,-48px); opacity: 1; } 38%,94% { transform: translate(50px,-48px); opacity: 0; } 100% { transform: translate(0,0); opacity: 0; } }</style>
<defs><clipPath id="win"><rect x="330" y="26" width="244" height="228" rx="10"/></clipPath></defs>
<rect x="1" y="1" width="598" height="278" rx="14" fill="#f7f7f2" stroke="#dddcd2"/>
<text x="28" y="50" class="mono" font-size="11.5" letter-spacing="2" fill="#6b8f00">GRAPHS / NEO4J</text>
<text x="28" y="96" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#16160f">TaxNet</text>
<text x="28" y="140" class="sans" font-size="15" fill="#66665a">Three spellings, one person,</text><text x="28" y="162" class="sans" font-size="15" fill="#66665a">and the ring around them.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#aeae9e">view repo -&gt;</text>
<rect x="330" y="26" width="244" height="228" rx="10" fill="#ffffff" stroke="#dddcd2"/>
<g clip-path="url(#win)">
<text x="344" y="48" class="mono" font-size="10.5" fill="#aeae9e">entity resolution, then motifs</text><g class="mv" style="animation-name: m0"><circle cx="382.0" cy="78" r="7" fill="#ffffff" stroke="#6b8f00" stroke-width="2"/><text x="382.0" y="98" text-anchor="middle" class="mono lbl" font-size="9.5" fill="#66665a">M. Ali</text></g><g class="mv" style="animation-name: m1"><circle cx="514.0" cy="72" r="7" fill="#ffffff" stroke="#6b8f00" stroke-width="2"/><text x="514.0" y="92" text-anchor="middle" class="mono lbl" font-size="9.5" fill="#66665a">Muhammad Ali</text></g><g class="mv" style="animation-name: m2"><circle cx="402.0" cy="166" r="7" fill="#ffffff" stroke="#6b8f00" stroke-width="2"/><text x="402.0" y="186" text-anchor="middle" class="mono lbl" font-size="9.5" fill="#66665a">Mohd. Ali</text></g><g class="one"><circle cx="452.0" cy="118" r="11" fill="#6b8f00"/><text x="452.0" y="144" text-anchor="middle" class="mono" font-size="9.5" fill="#16160f">one person</text></g><g class="ring"><polygon points="382.0,210 452.0,190 522.0,210 452.0,230" fill="#dc2626" fill-opacity=".1" stroke="#dc2626" stroke-width="1.6"/><rect x="376.0" y="204" width="12" height="12" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><rect x="446.0" y="184" width="12" height="12" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><rect x="516.0" y="204" width="12" height="12" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><rect x="446.0" y="224" width="12" height="12" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><line x1="452.0" y1="129" x2="452.0" y2="184" stroke="#dc2626" stroke-dasharray="3 3"/><text x="452.0" y="214" text-anchor="middle" class="mono" font-size="9" fill="#dc2626">ring</text></g>
</g>
</svg>
