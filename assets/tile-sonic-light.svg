<text x="28" y="172" class="sans" font-size="15" fill="#66665a">Speed, rings and loops,</text><text x="28" y="194" class="sans" font-size="15" fill="#66665a">written from scratch.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#aeae9e">view repo -&gt;</text>
