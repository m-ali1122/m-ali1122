<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="NEAT, implemented from the paper">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  .pop  { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
  .draw { animation: draw 1.1s ease-in-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
.mut { animation: mut 5s infinite; }
@keyframes mut { 0%,35% { opacity: 0; } 42%,92% { opacity: 1; } 100% { opacity: 0; } }
.fit { stroke-dasharray: 220; stroke-dashoffset: 220; animation: fit 5s ease-out infinite; }
@keyframes fit { 0% { stroke-dashoffset: 220; } 85%,100% { stroke-dashoffset: 0; } }
@keyframes gen0 { 0% { opacity: 1; } 20% { opacity: 0; } }
@keyframes gen1 { 0% { opacity: 0; } 20% { opacity: 1; } 40% { opacity: 0; } }
@keyframes gen2 { 0% { opacity: 0; } 40% { opacity: 1; } 60% { opacity: 0; } }
@keyframes gen3 { 0% { opacity: 0; } 60% { opacity: 1; } 80% { opacity: 0; } }
@keyframes gen4 { 0% { opacity: 0; } 80% { opacity: 1; } 100% { opacity: 0; } }</style>
<defs><clipPath id="win"><rect x="330" y="26" width="244" height="228" rx="10"/></clipPath></defs>
<rect x="1" y="1" width="598" height="278" rx="14" fill="#f7f7f2" stroke="#dddcd2"/>
<text x="28" y="50" class="mono" font-size="11.5" letter-spacing="2" fill="#6b8f00">NEUROEVOLUTION</text>
<text x="28" y="96" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#16160f">NEAT, from</text><text x="28" y="128" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#16160f">the paper</text>
<text x="28" y="172" class="sans" font-size="15" fill="#66665a">Networks that grow their own</text><text x="28" y="194" class="sans" font-size="15" fill="#66665a">topology to play Flappy Bird.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#aeae9e">view repo -&gt;</text>
<rect x="330" y="26" width="244" height="228" rx="10" fill="#ffffff" stroke="#dddcd2"/>
<g clip-path="url(#win)">
<text x="344" y="48" class="mono" font-size="11" fill="#aeae9e">fitness</text>
<text x="560" y="48" text-anchor="end" class="mono" font-size="11" fill="#66665a" opacity="0" style="animation: gen0 25s step-end infinite">gen 12</text><text x="560" y="48" text-anchor="end" class="mono" font-size="11" fill="#66665a" opacity="0" style="animation: gen1 25s step-end infinite">gen 13</text><text x="560" y="48" text-anchor="end" class="mono" font-size="11" fill="#66665a" opacity="0" style="animation: gen2 25s step-end infinite">gen 14</text><text x="560" y="48" text-anchor="end" class="mono" font-size="11" fill="#66665a" opacity="0" style="animation: gen3 25s step-end infinite">gen 15</text><text x="560" y="48" text-anchor="end" class="mono" font-size="11" fill="#66665a" opacity="0" style="animation: gen4 25s step-end infinite">gen 16</text>
