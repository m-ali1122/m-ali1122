<g class="code"><text x="344" y="48" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">mov  eax, [player_y]</text><text x="344" y="66" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">sub  eax, GRAVITY</text><text x="344" y="84" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">cmp  eax, GROUND_Y</text><text x="344" y="102" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">jle  .land</text><text x="344" y="120" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">call blit_sprite</text><text x="344" y="138" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">invoke Sleep, 16</text><text x="344" y="156" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">inc  [frame]</text><text x="344" y="174" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">jmp  game_loop</text><text x="344" y="192" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">mov  eax, [player_y]</text><text x="344" y="210" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">sub  eax, GRAVITY</text><text x="344" y="228" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">cmp  eax, GROUND_Y</text><text x="344" y="246" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">jle  .land</text><text x="344" y="264" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">call blit_sprite</text><text x="344" y="282" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">invoke Sleep, 16</text><text x="344" y="300" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">inc  [frame]</text><text x="344" y="318" class="mono" font-size="11" fill="#3a5ab0" fill-opacity=".45">jmp  game_loop</text></g>
