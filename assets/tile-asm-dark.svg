<text x="28" y="50" class="mono" font-size="11.5" letter-spacing="2" fill="#d4ff3f">x86 / MASM32</text>
<text x="28" y="96" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#f4f4ec">A platformer,</text><text x="28" y="128" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#f4f4ec">in assembly</text>
<text x="28" y="172" class="sans" font-size="15" fill="#9d9d92">Sprites, gravity and collisions,</text><text x="28" y="194" class="sans" font-size="15" fill="#9d9d92">one register at a time.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#58584f">view repo -&gt;</text>
