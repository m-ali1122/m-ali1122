<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="A platformer in x86 assembly">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  .pop  { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
  .draw { animation: draw 1.1s ease-in-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }

  .code { animation: up 9s linear infinite; } @keyframes up { to { transform: translateY(-144px); } }
  .bricks { animation: slide 1.1s linear infinite; } @keyframes slide { to { transform: translateX(-22px); } }
  .jump { animation: jump 1.8s cubic-bezier(.3,0,.4,1) infinite; }
  @keyframes jump { 0%,45%,100% { transform: none; } 62% { transform: translateY(-36px); } 80% { transform: none; } }
  .bump { animation: bump 1.8s infinite; } @keyframes bump { 0%,58%,72%,100% { transform: none; } 63% { transform: translateY(-5px); } }
  .coin { animation: coin 1.8s ease-out infinite; opacity: 0; }
  @keyframes coin { 0%,60% { opacity: 0; transform: none; } 63% { opacity: 1; } 85% { opacity: 1; transform: translateY(-34px); } 100% { opacity: 0; transform: translateY(-40px); } }
</style>
<defs><clipPath id="win"><rect x="330" y="26" width="244" height="228" rx="10"/></clipPath></defs>
