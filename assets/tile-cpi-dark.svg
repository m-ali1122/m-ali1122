<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="CPI inflation modelling, 1969 to 2026">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  .pop  { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
  .draw { animation: draw 1.1s ease-in-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }

  .ln1 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dl 7s ease-in-out infinite; }
  .ln2 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dl 7s ease-in-out .5s infinite; }
  .ln3 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dl 7s ease-in-out 1s infinite; }
  @keyframes dl { 0% { stroke-dashoffset: 1; opacity: 1; } 45%,88% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
<defs><clipPath id="win"><rect x="330" y="26" width="244" height="228" rx="10"/></clipPath></defs>
<rect x="1" y="1" width="598" height="278" rx="14" fill="#141412" stroke="#2c2c28"/>
<text x="28" y="50" class="mono" font-size="11.5" letter-spacing="2" fill="#d4ff3f">TIME SERIES</text>
<text x="28" y="96" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#f4f4ec">CPI inflation,</text><text x="28" y="128" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#f4f4ec">1969 to 2026</text>
<text x="28" y="172" class="sans" font-size="15" fill="#9d9d92">ARIMAX against a random forest,</text><text x="28" y="194" class="sans" font-size="15" fill="#9d9d92">on 686 months of FRED data.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#58584f">view repo -&gt;</text>
<rect x="330" y="26" width="244" height="228" rx="10" fill="#0c0c0b" stroke="#2c2c28"/>
