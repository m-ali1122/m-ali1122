<text x="28" y="96" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#f4f4ec">Temporal price</text><text x="28" y="128" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#f4f4ec">networks</text>
<text x="28" y="172" class="sans" font-size="15" fill="#9d9d92">Markets as graphs that rewire,</text><text x="28" y="194" class="sans" font-size="15" fill="#9d9d92">read before the regime shifts.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#58584f">view repo -&gt;</text>
<rect x="330" y="26" width="244" height="228" rx="10" fill="#0c0c0b" stroke="#2c2c28"/>
