<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="Ghar Ka Ustaad, maths misconception diagnosis">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  .pop  { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
  .draw { animation: draw 1.1s ease-in-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }

  .t1 { animation: t1 9s infinite; } .t2 { animation: t2 9s infinite; } .t3 { animation: t3 9s infinite; }
  @keyframes t1 { 0%,10% { opacity: 0; } 14%,92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes t2 { 0%,30% { opacity: 0; } 34%,92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes t3 { 0%,50% { opacity: 0; } 54%,92% { opacity: 1; } 100% { opacity: 0; } }
  .win { animation: win 9s infinite; } @keyframes win { 0%,62% { opacity: 0; } 68%,92% { opacity: 1; } 100% { opacity: 0; } }
</style>
<defs><clipPath id="win"><rect x="330" y="26" width="244" height="228" rx="10"/></clipPath></defs>
<rect x="1" y="1" width="598" height="278" rx="14" fill="#f7f7f2" stroke="#dddcd2"/>
<text x="28" y="50" class="mono" font-size="11.5" letter-spacing="2" fill="#6b8f00">PYTHON / DIAGNOSIS</text>
<text x="28" y="96" class="sans" font-size="27" font-weight="650" letter-spacing="-.6" fill="#16160f">Ghar Ka Ustaad</text>
<text x="28" y="140" class="sans" font-size="15" fill="#66665a">Finds the wrong rule behind</text><text x="28" y="162" class="sans" font-size="15" fill="#66665a">a child's maths mistake.</text>
<text x="28" y="252" class="mono" font-size="12" fill="#aeae9e">view repo -&gt;</text>
<rect x="330" y="26" width="244" height="228" rx="10" fill="#ffffff" stroke="#dddcd2"/>
<g clip-path="url(#win)">
<text x="414" y="78" text-anchor="end" class="mono" font-size="20" fill="#16160f">403</text>
<text x="352" y="104" class="mono" font-size="20" fill="#16160f">-</text>
<text x="414" y="104" text-anchor="end" class="mono" font-size="20" fill="#16160f">128</text>
<line x1="352" y1="114" x2="416" y2="114" stroke="#16160f" stroke-width="1.5"/>
<text x="414" y="140" text-anchor="end" class="mono" font-size="20" fill="#dc2626">325</text>
<text x="352" y="162" class="mono" font-size="9" fill="#aeae9e">child's answer</text><text x="434" y="48" class="mono" font-size="10" fill="#aeae9e">run every bug as code</text><g class="t1"><rect x="434" y="64" width="128" height="32" rx="5" fill="#f7f7f2" stroke="#dddcd2"/><text x="442" y="78" class="mono" font-size="9" fill="#66665a">correct method</text><text x="442" y="90" class="mono" font-size="10.5" fill="#16160f">-&gt; 275</text><text x="554" y="90" text-anchor="end" class="mono" font-size="9.5" fill="#dc2626">no</text></g><g class="t2"><rect x="434" y="106" width="128" height="32" rx="5" fill="#f7f7f2" stroke="#dddcd2"/><text x="442" y="120" class="mono" font-size="9" fill="#66665a">add, not subtract</text><text x="442" y="132" class="mono" font-size="10.5" fill="#16160f">-&gt; 531</text><text x="554" y="132" text-anchor="end" class="mono" font-size="9.5" fill="#dc2626">no</text></g><g class="t3"><rect x="434" y="148" width="128" height="32" rx="5" fill="#f7f7f2" stroke="#db2777"/><text x="442" y="162" class="mono" font-size="9" fill="#66665a">smaller from larger</text><text x="442" y="174" class="mono" font-size="10.5" fill="#16160f">-&gt; 325</text><text x="554" y="174" text-anchor="end" class="mono" font-size="9.5" fill="#db2777">match</text></g><text x="452.0" y="240" text-anchor="middle" class="mono win" font-size="10" fill="#db2777">today: a 5-minute task on borrowing</text>
</g>
</svg>
