<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="NU TimeTable, a colour-coded sheet decoded">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  .pop  { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; transform-box: fill-box; transform-origin: center; }
  .draw { animation: draw 1.1s ease-in-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes blink { 50% { opacity: 0; } }

  .scan { animation: scan 6s linear infinite; } @keyframes scan { 0% { transform: translateY(0); opacity: 1; } 45% { transform: translateY(182px); opacity: 1; } 50%,100% { opacity: 0; transform: translateY(182px); } }
  .hit { animation: hit 6s infinite; } @keyframes hit { 0%,40% { fill-opacity: .45; } 46%,92% { fill-opacity: 1; } 100% { fill-opacity: .45; } }
.row0 { animation: row0 6s infinite; } @keyframes row0 { 0%,48% { opacity: 0; transform: translateX(-8px); } 52%,92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.row1 { animation: row1 6s infinite; } @keyframes row1 { 0%,54% { opacity: 0; transform: translateX(-8px); } 58%,92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.row2 { animation: row2 6s infinite; } @keyframes row2 { 0%,60% { opacity: 0; transform: translateX(-8px); } 64%,92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.row3 { animation: row3 6s infinite; } @keyframes row3 { 0%,66% { opacity: 0; transform: translateX(-8px); } 70%,92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.row4 { animation: row4 6s infinite; } @keyframes row4 { 0%,72% { opacity: 0; transform: translateX(-8px); } 76%,92% { opacity: 1; transform: none; } 100% { opacity: 0; } }</style>
